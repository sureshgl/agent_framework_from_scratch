[project]
name = "minagent"
version = "0.1.0"
description = "A minimal agent framework built from scratch: the agent run as an inspectable runtime."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "mcp>=1.0",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/minagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]